<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="tg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B6CF6"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>
    <mask id="notches">
      <rect x="0" y="0" width="512" height="512" fill="#fff"/>
      <!-- perforation notches + left edge punch, in ticket-local coords -->
      <g transform="rotate(-14 256 256)">
        <circle cx="342" cy="106" r="26" fill="#000"/>
        <circle cx="342" cy="406" r="26" fill="#000"/>
        <circle cx="46" cy="256" r="26" fill="#000"/>
      </g>
    </mask>
  </defs>
  <g transform="rotate(-14 256 256)" mask="url(#notches)">
    <rect x="46" y="106" width="420" height="300" rx="54" fill="url(#tg)"/>
    <!-- dashed perforation -->
    <line x1="342" y1="130" x2="342" y2="382" stroke="#fff" stroke-width="12"
          stroke-dasharray="24 20" stroke-linecap="round" opacity="0.92"/>
    <!-- the i -->
    <circle cx="196" cy="176" r="33" fill="#fff"/>
    <rect x="172" y="228" width="48" height="130" rx="24" fill="#fff"/>
    <rect x="172" y="322" width="86" height="36" rx="18" fill="#fff"/>
  </g>
</svg>
